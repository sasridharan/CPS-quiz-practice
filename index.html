<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📝</text></svg>">
<title>Corporate Political Strategy Quiz 2 Practice</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --paper:#F4F6F9; --card:#FFFFFF; --ink:#1B2430; --ink-2:#4A5568; --ink-3:#7B8794;
  --line:#D9E0E8; --navy:#1F3A5F; --navy-soft:#E4EBF4; --green:#1B7F3B; --green-soft:#E3F3E8;
  --red:#B0392C; --red-soft:#F8E6E3; --focus:#2F6FCC;
  --display:'Fraunces',Georgia,'Times New Roman',serif;
  --body:'Source Sans 3','Segoe UI',Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#141A22; --card:#1D2530; --ink:#EDF1F5; --ink-2:#B6C0CC; --ink-3:#8593A2;
    --line:#2E3946; --navy:#9DBBE0; --navy-soft:#26354A; --green:#5FC97F; --green-soft:#1C3A28;
    --red:#F08A7C; --red-soft:#4A2622; --focus:#7FB0F5;
  }
}
:root[data-theme="dark"]{
  --paper:#141A22; --card:#1D2530; --ink:#EDF1F5; --ink-2:#B6C0CC; --ink-3:#8593A2;
  --line:#2E3946; --navy:#9DBBE0; --navy-soft:#26354A; --green:#5FC97F; --green-soft:#1C3A28;
  --red:#F08A7C; --red-soft:#4A2622; --focus:#7FB0F5;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45}
.app{max-width:820px;margin:0 auto;padding-block:16px 24px;padding-inline:16px;display:flex;flex-direction:column;gap:14px;min-height:100%}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;line-height:1.1;color:var(--navy);text-wrap:balance}
.brand .sub{color:var(--ink-3);font-size:14px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.ghost{font:inherit;font-size:14px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
.ghost{color:var(--ink-2)}
.score{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.bar{height:6px;background:var(--navy-soft);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--navy);width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 1px 2px rgba(20,30,50,.06)}
.eyebrow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;font-size:13px;color:var(--ink-2)}
.chip{display:inline-block;border-radius:999px;padding:1px 9px;font-size:12px;letter-spacing:.02em;background:var(--navy-soft);color:var(--navy)}
.stem{font-size:19px;line-height:1.4;margin:0;max-width:68ch}
.fig{max-width:620px}.fig svg{width:100%;height:auto;border:1px solid var(--line);border-radius:8px}
.opts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.opts button{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;font:inherit;font-size:16px;color:var(--ink);padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer}
.opts button:hover:not(:disabled){border-color:var(--navy)}
.opts button:disabled{cursor:default}
.opts .l{font-weight:600;color:var(--ink-3);min-width:1.2em}
.opts button.correct{border-color:var(--green);background:var(--green-soft)}
.opts button.correct .l,.opts button.correct .t{color:var(--green);font-weight:600}
.opts button.wrong{border-color:var(--red);background:var(--red-soft)}
.opts button.wrong .l,.opts button.wrong .t{color:var(--red)}
.verdict{font-weight:700}
.verdict.ok{color:var(--green)}.verdict.no{color:var(--red)}
.expl{font-size:14px;color:var(--ink-2);font-style:italic;margin:0;max-width:75ch}
.nav{display:flex;align-items:center;justify-content:space-between;gap:10px}
.nav button{font:inherit;font-size:15px;font-weight:600;padding:9px 16px;border-radius:8px;border:1px solid var(--navy);background:var(--navy);color:var(--paper);cursor:pointer}
.nav button:disabled{opacity:.4;cursor:default}
.pos{font-size:14px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.hint{font-size:12.5px;color:var(--ink-3);text-align:center}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
button:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media (max-width:520px){.card{padding:16px}.stem{font-size:17px}.nav button{padding:9px 12px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <h1>Corporate Political Strategy Quiz 2 Practice</h1>
      <div class="sub">ACT 438/538 · questions and answer choices are in a fresh random order every visit</div>
    </div>
    <div class="controls">
      <select id="f-lecture" aria-label="Lecture"><option value="">All lectures</option></select>
      <button class="ghost" type="button" id="reshuffle">Reshuffle</button>
      <button class="ghost" type="button" id="reset">Clear progress</button>
    </div>
  </header>
  <div class="score" id="score"></div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>

  <main class="card" id="card"></main>

  <footer class="nav">
    <button id="prev" type="button">← Prev</button>
    <span class="pos" id="pos"></span>
    <button id="next" type="button">Next →</button>
  </footer>
  <div class="hint">Keys: 1–4 or a–d to answer · ← → to move · Enter for next unanswered</div>
</div>

<script>
const Q = [{"id": "Q1B-122", "lecture": "L10", "stem": "Which of the following regulatory agencies has jurisdiction over review of merger agreements between firms?", "opts": ["Food and Drug Administration", "Department of State", "Nuclear Regulatory Commission", "Federal Trade Commission"], "correct": 3, "expl": "The Federal Trade Commission, together with the Justice Department's Antitrust Division, reviews proposed mergers for harm to competition. The other agencies regulate food and drugs, foreign affairs, and nuclear safety."}, {"id": "Q1B-123", "lecture": "Case-Uber", "stem": "In the Uber case, Councilmember Mary Cheh's amendment to the D.C. taxi bill proposed", "opts": ["requiring all Uber drivers to undergo background checks", "establishing a minimum fare per trip for Uber rides", "requiring Uber drivers to obtain taxi medallions", "establishing a maximum fare per trip for Uber rides"], "correct": 1, "expl": "Councilmember Cheh's amendment would have set a minimum fare for sedan services like Uber, several times the taxi starting fare, which would have kept Uber from offering cheaper rides."}, {"id": "Q1B-130", "lecture": "L9", "stem": "Which of the following is an example of a trade secret?", "opts": ["The recipe for Coca-Cola’s soft drink formula", "A design patent for a new bottle shape", "A copyright on Coca-Cola’s advertising jingle", "The trademark for Coca-Cola’s logo"], "correct": 0, "expl": "A trade secret is valuable information a firm keeps confidential, like a recipe. Unlike a patent, it never has to be disclosed and can last as long as it stays secret."}, {"id": "Q2B-003", "lecture": "L9", "stem": "Which of the following is **not** a requirement for patenting an invention?", "opts": ["The invention must already be sold commercially", "The invention must be novel", "The invention must be non-obvious to a person skilled in the field", "The invention must be described in enough detail that others could make it"], "correct": 0, "expl": "To be patented, an invention must be useful, new, not obvious to someone skilled in the field, and described well enough that others could make it. It does not need to be on the market; inventors often patent long before they sell anything."}, {"id": "Q2B-011", "lecture": "L9", "stem": "Escalator, trampoline, and cellophane were all once brand names. Their owners lost trademark protection because", "opts": ["the companies stopped making the products and let the marks lapse", "the names became the ordinary words for those kinds of products", "competitors registered the same names first in other countries", "Congress capped trademark protection for widely sold products"], "correct": 1, "expl": "This is genericide. When the public uses a brand name as the general word for a type of product, rather than for one company's version, the mark no longer identifies a source, and the owner can lose it. Market dominance can make this more likely, not less."}, {"id": "Q2B-023", "lecture": "L10", "stem": "Which feature of the Federal Trade Commission is designed to make it bipartisan?", "opts": ["Any one party is capped at three of its five commissioners", "Its chair alternates between the two parties every two years", "Its commissioners are elected by a joint vote of the House and Senate", "Its enforcement decisions require a unanimous vote of all commissioners"], "correct": 0, "expl": "The FTC has five commissioners nominated by the president and confirmed by the Senate. The law caps any one party at three seats, so the minority party is always meant to have a voice."}, {"id": "Q2B-026", "lecture": "L10", "stem": "When a court treats conduct as a *per se* violation of antitrust law, what defense is available to the defendant?", "opts": ["Only that it did not commit the act", "That the conduct produced savings that were passed on to consumers", "That the conduct was reasonable given conditions in the industry", "That its market share was too small to harm competition"], "correct": 0, "expl": "Per se means the conduct is illegal in itself. The court does not weigh its effects or reasons, so the only way to win is to show you did not do it. Arguments about efficiency or reasonableness belong to the other standard."}, {"id": "Q2B-044", "lecture": "L11", "stem": "Trade theory suggests a tariff should push down the prices foreign exporters charge. Recent evidence on U.S. tariffs suggests the cost has fallen mostly on", "opts": ["foreign exporters, who must cut their prices", "the foreign governments targeted by the tariff", "the domestic producers that the tariff protects", "U.S. importers, mostly in their own margins"], "correct": 3, "expl": "In theory a tariff squeezes foreign exporters' prices, but the evidence shows U.S. importers absorbed most of the cost, first in their own margins, with only part of it passed through to retail prices."}, {"id": "Q2B-051", "lecture": "L11", "stem": "A country requires imported toys to pass a safety test that domestically made toys do not have to pass. Which WTO principle does this most directly violate?", "opts": ["Most favored nation", "Antidumping duties", "National treatment", "Reciprocity"], "correct": 2, "expl": "National treatment requires a country to treat imported goods the same as its own goods once they are in the market. A stricter safety test only for imports breaks that rule."}, {"id": "Q2B-061", "lecture": "L12", "stem": "Which of the following is an example of **private** politics?", "opts": ["An advocacy group's online campaign pushes a grocery chain to drop a supplier", "The House votes on a bill to raise tariffs on imported steel and aluminum", "The Justice Department sues to block a merger between two large airlines", "A firm lobbies its state legislature to extend a tax credit for its plant"], "correct": 0, "expl": "Private politics happens outside government: activists pressure a company directly through markets and media. A campaign aimed at a grocery chain's sourcing is private; a vote in Congress, a federal lawsuit, and lobbying a legislature all run through government institutions."}, {"id": "Q2B-081", "lecture": "Case-Uber", "stem": "In January 2012, Uber's defenders argued that its D.C. service was legal by pointing to", "opts": ["a federal statute that keeps cities from regulating smartphone dispatch apps", "a temporary operating permit the Taxicab Commission issued when Uber launched", "D.C.'s limo rules, which define sedans as for-hire cars charging by time and mileage", "a Council resolution exempting all app-based car services"], "correct": 2, "expl": "D.C.'s own rules described a sedan as a hired car that charges on the basis of time and mileage, which is how Uber priced its rides. The Taxicab Commission chairman read the rules differently, and even the industry lawyer's memo called them unclear. Uber had no permit, no Council exemption and no federal protection."}, {"id": "Q2B-101", "lecture": "Case-Amazon", "stem": "An antitrust case against Amazon would impose large costs on one firm, while any benefits would be spread thinly across millions of shoppers and sellers. Under the Wilson-Lowi matrix this is:", "opts": ["client politics", "interest group politics", "majoritarian politics", "entrepreneurial politics"], "correct": 3, "expl": "Costs fall on one identifiable firm while the gains are spread across many people, which is entrepreneurial politics. Change of this kind usually needs someone to push it, and here a legal scholar who later ran the FTC played that role."}, {"id": "Q2B-102", "lecture": "Case-Amazon", "stem": "Shortly after Lina Khan became chair of the FTC in 2021, how did Amazon respond?", "opts": ["it ran ads asking Prime members to call Congress about the FTC", "it petitioned the FTC to recuse her, citing her earlier writing", "it agreed to separate its retail business from its Marketplace", "it sued in federal court to overturn her Senate confirmation"], "correct": 1, "expl": "Amazon went after the decision maker: it argued that Khan had already said in print that Amazon broke the antitrust laws, so she could not judge its case fairly. She did not step aside."}, {"id": "Q2B-129", "lecture": "Case-Amazon", "stem": "Khan describes how Amazon's demands for heavy discounts from FedEx and UPS affected other online sellers. What happened, in her account?", "opts": ["other sellers faced price hikes, and Amazon could win them as delivery clients", "FedEx and UPS stopped carrying rivals' packages until regulators intervened", "Congress capped the discounts that shippers could offer to any single large retailer", "other sellers won the same discounts by joining a buying group organized by Walmart"], "correct": 0, "expl": "Amazon used its size to win big shipping discounts, and the carriers made up for it by charging other sellers more. Those sellers then had a reason to turn to Amazon's own fulfillment and delivery business, so dominance in retail helped Amazon grow in a second line of business."}, {"id": "Q2B-154", "lecture": "L12", "stem": "An industry faces a credible threat of a new law. In theory, how much self-regulation will a firm choose?", "opts": ["The least self-regulation that makes the law not worth passing", "Exactly the standard the government would otherwise impose", "Whatever standard the most active advocacy groups demand", "The strictest program that its rivals are willing to match"], "correct": 0, "expl": "Passing a law is costly, so a firm only has to close enough of the gap that the remaining difference is not worth a legislature's effort. It gives up as little as possible, and the strategy works only while the threat of a law is credible."}, {"id": "Q2B-173", "lecture": "L11", "stem": "Debate over multilateral trade deals is characterized by what type of political competition?", "opts": ["Interest group politics", "Entrepreneurial politics", "Majoritarian politics", "Client politics"], "correct": 2, "expl": "A multilateral deal spreads both its gains and its costs across many people and industries, so neither side is concentrated. Widely distributed benefits and costs is majoritarian politics."}, {"id": "Q2B-174", "lecture": "L11", "stem": "Which of the following is **not** one of the institutional arenas where U.S. trade policy is made?", "opts": ["the U.S. Trade Representative", "the Department of the Treasury", "the Office of the President", "the U.S. Congress"], "correct": 1, "expl": "Trade policy is made by Congress, which holds the power over duties, the President, to whom much of it is delegated, and agencies such as the U.S. Trade Representative. The Treasury collects tariff revenue but is not one of the arenas where trade policy is decided."}, {"id": "Q2B-175", "lecture": "Case-Love", "stem": "For about 25 years after the Wright Amendment passed in 1979, Southwest Airlines", "opts": ["stayed \"passionately neutral\" on the law", "financed an astroturf campaign to repeal the law", "gave campaign money to challengers who backed repeal", "formed a coalition with other airlines to repeal the law"], "correct": 0, "expl": "For roughly 25 years Southwest called itself \"passionately neutral\" on the Wright Amendment and built its business around it. It only pushed for repeal in late 2004."}, {"id": "Q2B-176", "lecture": "Case-Love", "stem": "In November 2004, Southwest CEO Gary Kelly announced that Southwest would", "opts": ["stop flying from Love Field until the law was repealed", "move most of its Dallas service to DFW Airport", "push for repeal of the Wright Amendment", "sue American Airlines under the Clayton Act"], "correct": 2, "expl": "In November 2004, after Delta left DFW, Southwest dropped its long neutrality and announced it would seek repeal of the Wright Amendment."}, {"id": "Q2B-179", "lecture": "L12", "stem": "How can self-regulation by companies help them avoid government regulation?", "opts": ["By making government intervention look unnecessary", "By satisfying consumer demand for transparency", "By raising participating companies' market share", "By cutting their operating costs and raising efficiency"], "correct": 0, "expl": "If an industry regulates itself enough, lawmakers see less need to step in. Self-regulation preempts public regulation by making a new law look unnecessary."}, {"id": "Q2B-180", "lecture": "L12", "stem": "Which of the following is **not** a motivation for a boycott?", "opts": ["to show public opposition to a company's own policies", "to cut into a company's sales and profits", "to maximize profits within law and ethical custom", "to harm a company's public reputation"], "correct": 2, "expl": "Boycotts aim to signal opposition to a company's policies and to pressure it through its profits or its reputation. Maximizing profits within the law and ethical custom describes the firm's own goal, not a boycotter's."}];
const LNAME = Object.fromEntries([["L1", "Course overview"], ["L2", "The 4Is"], ["L3", "Government primer"], ["L4", "Media"], ["L5", "Legislative strategy"], ["L6", "Campaign finance"], ["L7", "Lobbying"], ["L8", "Regulation"], ["SS1", "Stepping Stone 1"], ["L9", "Intellectual property"], ["L10", "Antitrust"], ["L11", "Global politics"], ["L12", "Private politics"], ["Case-Uber", "Uber case"], ["Case-Amazon", "Amazon case"], ["Case-Love", "Lobbying for Love case"], ["Guest", "Guest lecture"]]);
const $ = s => document.querySelector(s);
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

/* answers this viewer has given: id -> {pick (option text), ok} */
let answers = {};
try { answers = JSON.parse(lsGet('answers') || '{}') || {}; } catch(e){ answers = {}; }

/* shuffled deck: order of ids + per-question option order (fresh each load) */
function shuffle(a){ for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
let deck = [];
function build(){
  deck = shuffle(Q.map(q => {
    const idx = shuffle([0,1,2,3]);
    return { q, order: idx };
  }));
}
build();
let lec = lsGet('f-lecture') || '';
let view = [], idx = 0;

const fl = $('#f-lecture');
[...new Set(Q.map(q => q.lecture))].sort((a,b) => Object.keys(LNAME).indexOf(a) - Object.keys(LNAME).indexOf(b))
  .forEach(k => { const o=document.createElement('option'); o.value=k; o.textContent=(k.startsWith('L')?k+' · ':'')+(LNAME[k]||k); fl.appendChild(o); });
fl.value = lec;
fl.addEventListener('change', () => { lec = fl.value; lsSet('f-lecture', lec); idx = 0; applyFilter(); });
$('#reshuffle').addEventListener('click', () => { build(); idx = 0; applyFilter(); });
$('#reset').addEventListener('click', () => { answers = {}; lsDel('answers'); render(); });

function applyFilter(){ view = deck.filter(d => !lec || d.q.lecture===lec); idx = Math.min(idx, Math.max(0, view.length-1)); render(); }

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\*(.+?)\*/g,'<em>$1</em>'); }
function renderScore(){
  const ids = view.map(d => d.q.id);
  const done = ids.filter(i => answers[i]).length, ok = ids.filter(i => answers[i] && answers[i].ok).length;
  $('#score').innerHTML = `<span>Answered <b>${done}</b> of <b>${ids.length}</b></span><span>Correct <b>${ok}</b>${done ? ` (${Math.round(100*ok/done)}%)` : ''}</span>`;
  $('#bar').style.width = ids.length ? (100*done/ids.length)+'%' : '0';
}
function render(){
  renderScore();
  const card = $('#card'), n = view.length;
  $('#pos').textContent = n ? `${idx+1} of ${n}` : '0 of 0';
  $('#prev').disabled = idx<=0; $('#next').disabled = idx>=n-1;
  if (!n){ card.innerHTML = '<div class="empty">No questions in this lecture.</div>'; return; }
  const {q, order} = view[idx];
  const a = answers[q.id];
  card.innerHTML = `
    <div class="eyebrow"><span class="chip">${esc((q.lecture.startsWith('L')?q.lecture+' · ':'')+(LNAME[q.lecture]||q.lecture))}</span></div>
    <p class="stem">${fmt(q.stem)}</p>
    ${q.svg ? `<div class="fig">${q.svg}</div>` : ''}
    <ul class="opts">${order.map((oi,k) => {
      const text = q.opts[oi];
      let cls = '';
      if (a){ if (oi===q.correct) cls='correct'; else if (a.pick===text) cls='wrong'; }
      return `<li><button type="button" data-k="${k}" class="${cls}" ${a?'disabled':''}><span class="l">${'abcd'[k]}.</span><span class="t">${fmt(text)}</span></button></li>`;
    }).join('')}</ul>
    ${a ? `<div class="verdict ${a.ok?'ok':'no'}">${a.ok ? 'Correct.' : 'Not quite. The correct answer is highlighted.'}</div><p class="expl">${esc(q.expl)}</p>` : ''}`;
  card.querySelectorAll('.opts button').forEach(b => b.addEventListener('click', () => answer(parseInt(b.dataset.k,10))));
}
function answer(k){
  const {q, order} = view[idx];
  if (answers[q.id]) return;
  const oi = order[k];
  answers[q.id] = { pick: q.opts[oi], ok: oi===q.correct };
  lsSet('answers', JSON.stringify(answers));
  render();
}
function go(i){ if (i<0 || i>=view.length) return; idx=i; render(); window.scrollTo({top:0}); }
$('#prev').addEventListener('click', () => go(idx-1));
$('#next').addEventListener('click', () => go(idx+1));
document.addEventListener('keydown', e => {
  const tag=(e.target.tagName||'').toLowerCase(); if (tag==='select' || tag==='input' || tag==='textarea') return;
  if (e.key==='ArrowRight') go(idx+1);
  else if (e.key==='ArrowLeft') go(idx-1);
  else if (e.key==='Enter'){ const j = view.findIndex((d,i) => i>idx && !answers[d.q.id]); if (j>=0) go(j); }
  else if ('1234'.includes(e.key) && e.key) answer(parseInt(e.key,10)-1);
  else if ('abcd'.includes(e.key.toLowerCase()) && e.key.length===1) answer('abcd'.indexOf(e.key.toLowerCase()));
});
applyFilter();
</script>
</body>
</html>
